# Green environment overlay for blue-green deployment

services:
  backend-green:
    image: jawab24-backend:latest
    container_name: jawab24-backend-green
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file:
      - ./env/backend.env
    environment:
      - NODE_ENV=production
      - DEPLOY_ENV=green
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - REDIS_HOST=redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_in_production}
      - AI_SERVICE_URL=http://ai-worker-green:3002
      # Internal, colour-scoped like AI_SERVICE_URL above. It MUST live here
      # rather than in env/backend.env: that file is shared by both overlays,
      # so a colour baked into it is right on one deploy and silently wrong on
      # the next — revalidation would POST at the idle container and every
      # plan write would look successful while the pricing page stayed stale.
      # Not routed through nginx: nginx sends /api/* to the BACKEND, so the
      # public https://jawab24.com/api/revalidate never reaches Next.js.
      - FRONTEND_REVALIDATE_URL=http://frontend-green:3001/api/revalidate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jawab24-network
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend-green:
    image: jawab24-frontend:latest
    container_name: jawab24-frontend-green
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Every NEXT_PUBLIC_* ARG the Dockerfile declares MUST be listed here.
      # Next.js inlines these at BUILD time, so an omitted arg is compiled to
      # `undefined` and the feature dies silently in the image — it cannot be
      # repaired by env_file at runtime. `frontend`, `frontend-blue` and
      # `frontend-green` all tag jawab24-frontend:latest, so the lists must be
      # identical; pinned by frontend/test/deployBuildArgs.test.ts.
      args:
        - NEXT_PUBLIC_FB_APP_ID=${NEXT_PUBLIC_FB_APP_ID:-}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://jawab24.com/api}
        - NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        - NEXT_PUBLIC_WHATSAPP_CONFIG_ID=${NEXT_PUBLIC_WHATSAPP_CONFIG_ID:-}
        - NEXT_PUBLIC_WHATSAPP_CANARY_ADMIN_ONLY=${NEXT_PUBLIC_WHATSAPP_CANARY_ADMIN_ONLY:-}
        - NEXT_PUBLIC_WHATSAPP_CONNECT_REDIRECT=${NEXT_PUBLIC_WHATSAPP_CONNECT_REDIRECT:-}
        - NEXT_PUBLIC_INSTAGRAM_DIRECT_ENABLED=${NEXT_PUBLIC_INSTAGRAM_DIRECT_ENABLED:-}
        - NEXT_PUBLIC_PHONE_AUTH_ENABLED=${NEXT_PUBLIC_PHONE_AUTH_ENABLED:-}
        - NEXT_PUBLIC_CHECKOUT_MAINTENANCE=${NEXT_PUBLIC_CHECKOUT_MAINTENANCE:-}
        - SEMANTIC_VERSION=${SEMANTIC_VERSION:-untagged}
    restart: unless-stopped
    env_file:
      - ./env/frontend.env
    environment:
      - NODE_ENV=production
      - DEPLOY_ENV=green
    networks:
      - jawab24-network
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-worker-green:
    image: jawab24-ai-worker:latest
    container_name: jawab24-ai-worker-green
    build:
      context: .
      dockerfile: ai-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/ai.env
    environment:
      - NODE_ENV=production
      - DEPLOY_ENV=green
      - REDIS_HOST=redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_in_production}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jawab24-network
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"








