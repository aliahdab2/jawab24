<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Pattern overlay -->
  <rect width="1200" height="630" fill="url(#pattern)" opacity="0.1"/>
  
  <!-- Logo icon -->
  <rect x="500" y="180" width="80" height="80" rx="20" fill="url(#logo-gradient)"/>
  <path d="M520 220 L540 220 L540 200 L560 220 L560 240 L520 240 Z" fill="white" opacity="0.9"/>
  
  <!-- Title -->
  <text x="600" y="320" font-family="system-ui, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">Jawab24</text>
  
  <!-- Subtitle EN -->
  <text x="600" y="380" font-family="system-ui, sans-serif" font-size="28" fill="#99f6e4" text-anchor="middle">Smart Facebook Auto-Replies 24/7</text>
  
  <!-- Subtitle AR -->
  <text x="600" y="430" font-family="system-ui, sans-serif" font-size="24" fill="#99f6e4" text-anchor="middle" direction="rtl">ردود ذكية على مدار الساعة</text>
  
  <!-- Stats -->
  <text x="300" y="530" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">24/7</text>
  <text x="300" y="560" font-family="system-ui, sans-serif" font-size="16" fill="#a1a1aa" text-anchor="middle">Available</text>
  
  <text x="600" y="530" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">&lt;1s</text>
  <text x="600" y="560" font-family="system-ui, sans-serif" font-size="16" fill="#a1a1aa" text-anchor="middle">Response Time</text>
  
  <text x="900" y="530" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">99%</text>
  <text x="900" y="560" font-family="system-ui, sans-serif" font-size="16" fill="#a1a1aa" text-anchor="middle">Accuracy</text>
  
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="logo-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white"/>
    </pattern>
  </defs>
</svg>

