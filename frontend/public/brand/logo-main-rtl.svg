<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Pure White Background -->
  <rect width="1024" height="1024" fill="white"/>
  
  <!-- Content Scaled to 88% (Safe Margin) AND Mirrored Horizontally -->
  <!-- transform origin is center (512 512) for mirroring mechanism inside the group -->
  <g transform="translate(61.44, 61.44) scale(0.88)">
    <defs>
      <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <!-- Gradient direction flipped visually to maintain Left-to-Right consistency light source or matching brand? 
             Usually brand gradients flow same way (Top-Left to Bottom-Right). 
             Flipping the whole object flips the gradient too.
             Let's keep gradient consistent (Cyan Top-Left -> Orange Bottom-Right) even in RTL usually, 
             BUT the user wants "RTL Support".
             Simply scaling X by -1 flips gradient.
             Better to flip only the BUbble Path or flip group and unflip gradient.
             Easiest: Flip geometry.
        -->
        <stop offset="0%" style="stop-color:#06B6D4"/> 
        <stop offset="100%" style="stop-color:#F97316"/> 
      </linearGradient>
    </defs>
    
    <!-- Background Shape (Symmetric, so flipping doesn't matter much unless we want specific corner radius, but rx=220 is uniform) -->
    <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgGradient)"/>
    
    <!-- Chat Bubble Path (Mirrored around X=512) 
         Original M starts at 512.
         Transformation: newX = 1024 - oldX
    -->
    <path transform="translate(1024, 0) scale(-1, 1)" d="M512 240C339.2 240 198.4 355.2 198.4 496C198.4 564.8 233.6 627.2 291.2 672C291.2 672 275.2 752 224 800C224 800 332.8 784 400 736C435.2 752 473.6 760 512 760C684.8 760 825.6 644.8 825.6 504C825.6 363.2 684.8 240 512 240Z" fill="white" fill-opacity="1.0"/>
  </g>
</svg>
