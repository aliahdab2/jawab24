apply plugin: 'com.android.application'
apply plugin: 'com.github.triplet.play'

// Read local.properties for build secrets (Facebook, Sentry)
// Required keys: FACEBOOK_APP_ID, FACEBOOK_CLIENT_TOKEN
// Optional keys: SENTRY_DSN
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def facebookAppId = localProperties.getProperty('FACEBOOK_APP_ID', '')
def facebookClientToken = localProperties.getProperty('FACEBOOK_CLIENT_TOKEN', '')
def sentryDsn = localProperties.getProperty('SENTRY_DSN', '')

// Release signing — keystore path & credentials from local.properties
// Required keys: RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
def releaseStoreFile = localProperties.getProperty('RELEASE_STORE_FILE', '')
def releaseStorePassword = localProperties.getProperty('RELEASE_STORE_PASSWORD', '')
def releaseKeyAlias = localProperties.getProperty('RELEASE_KEY_ALIAS', '')
def releaseKeyPassword = localProperties.getProperty('RELEASE_KEY_PASSWORD', '')

// Version is overridable from CI via -PappVersionName / -PappVersionCode.
// Local/dev builds fall back to the literals below (kept at the last released values).
def appVersionName = project.findProperty('appVersionName') ?: "2.0.43"
def appVersionCode = (project.findProperty('appVersionCode') ?: "20043") as Integer

if (facebookAppId.isEmpty()) {
    logger.warn("WARNING: FACEBOOK_APP_ID not set in local.properties. Facebook login will not work.")
}

def getTimestamp() {
    return new Date().format('yyyyMMdd-HHmm')
}

android {
    namespace = "com.jawab24.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jawab24.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Inject Facebook secrets as string resources from local.properties
        resValue "string", "facebook_app_id", facebookAppId
        resValue "string", "facebook_client_token", facebookClientToken
        resValue "string", "fb_login_protocol_scheme", "fb${facebookAppId}"

        // Sentry DSN available at runtime via BuildConfig.SENTRY_DSN
        buildConfigField "String", "SENTRY_DSN", "\"${sentryDsn}\""

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
             // Added *.apk to prevent APK-inside-APK bloat from public/apk/ folder
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:*.apk'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (!releaseStoreFile.isEmpty()) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (!releaseStoreFile.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def date = getTimestamp()
            outputFileName = "Jawab24-${variant.name}-${date}.apk"
        }
    }
}

// Gradle Play Publisher — uploads the signed AAB to Google Play.
// Credentials come from the ANDROID_PUBLISHER_CREDENTIALS env var (raw JSON) in CI;
// no key file is committed. Track defaults to 'internal' and is overridden per-run
// with the --track CLI flag. For a staged production rollout, add
// `--release-status inProgress --user-fraction 0.1` to the gradle command.
play {
    track = 'internal'
    defaultToAppBundles = true
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Sentry — native crash reporting & ANR detection
    implementation 'io.sentry:sentry-android:8.17.0'

    // Google Play In-App Updates
    implementation 'com.google.android.play:app-update:2.1.0'

    // Firebase Cloud Messaging for push notifications
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
