events {
    worker_connections 1024;
}

http {
    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Include upstream configuration (for blue-green deployment)
    include /etc/nginx/upstream.conf;
    
    # Note: keepalive settings are configured in the upstream blocks
    # in upstream.conf (keepalive directive)

    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=token_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=100r/s;

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name jawab24.com www.jawab24.com;

        # Health check endpoint (for load balancers)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Allow health checks on HTTP for local smoke tests (localhost/CI only)
        location = /api/health {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://backend_active/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Allow version check on HTTP for deployment verification
        location = /api/version {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://backend_active/version;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ACME challenge for SSL renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP to HTTPS (always non-www)
        location / {
            return 301 https://jawab24.com$request_uri;
        }
    }

    # Redirect www to non-www (HTTPS)
    server {
        listen 443 ssl;
        http2 on;
        server_name www.jawab24.com;

        ssl_certificate /etc/letsencrypt/live/jawab24.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jawab24.com/privkey.pem;

        return 301 https://jawab24.com$request_uri;
    }

    # HTTPS server (non-www only)
    server {
        listen 443 ssl;
        http2 on;
        server_name jawab24.com;

        # SSL certificates (mounted from Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/jawab24.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jawab24.com/privkey.pem;

        # SSL settings
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://js.stripe.com https://checkout.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://ui-avatars.com https://www.transparenttextures.com https://graph.facebook.com https://*.fbcdn.net https://*.fbsbx.com https://*.stripe.com data: blob:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://*.sentry.io https://checkout.stripe.com; frame-src 'self' https://www.facebook.com https://js.stripe.com https://checkout.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://www.facebook.com;" always;

        # ─────────────────────────────────────────────────────────────────
        # Legacy WordPress / French content cleanup (SEO)
        # The domain previously hosted a French WordPress site ("Sujet24").
        # Old French URLs are still indexed by Google. We respond with
        # 410 Gone so Google removes them from the index faster than 404,
        # and we 301-redirect the most common attack/crawl paths to /.
        # ─────────────────────────────────────────────────────────────────

        # 1) WordPress dated archives:  /YYYY/...  /YYYY/MM/...  /YYYY/MM/DD/slug/
        location ~ "^/(19|20)\d{2}(/|$)" {
            add_header Content-Type "text/html; charset=utf-8" always;
            return 410 "<!doctype html><meta charset=utf-8><title>Gone</title><h1>410 Gone</h1><p>This page has been permanently removed. Visit <a href=\"https://jawab24.com/\">jawab24.com</a>.</p>";
        }

        # 2) French slug patterns (old article slugs that don't collide with current routes)
        #    Matches: /les-..., /la-..., /le-..., /des-..., /du-..., /une-..., /un-...,
        #             /quel-..., /quelle-..., /quels-..., /quelles-...,
        #             /comment-..., /pourquoi-..., /combien-...
        location ~* ^/(les|la|le|des|du|une|un|quel(le)?s?|comment|pourquoi|combien)- {
            add_header Content-Type "text/html; charset=utf-8" always;
            return 410 "<!doctype html><meta charset=utf-8><title>Gone</title><h1>410 Gone</h1><p>This page has been permanently removed. Visit <a href=\"https://jawab24.com/\">jawab24.com</a>.</p>";
        }

        # 3) WordPress core paths (taxonomy, feeds, admin, probes) — also leftover from old site
        location ~* ^/(category|tag|author|feed|comments-feed)(/|$) {
            return 410;
        }
        location ~* ^/(wp-admin|wp-includes|wp-content|wp-json)(/|$) {
            return 410;
        }
        location ~* ^/(wp-login\.php|xmlrpc\.php|wp-config\.php)$ {
            return 410;
        }

        # 4) (Removed) Old French content has no topical relevance to the current SaaS.
        #    Redirecting unrelated URLs to "/" is treated as a soft-404 by Google
        #    (https://developers.google.com/search/docs/crawling-indexing/301-redirects).
        #    These URLs now fall through to rule #2 above and return 410 Gone.
        #    If GSC → Links ever shows external backlinks to a specific legacy URL,
        #    add a `location =` block here that 301s to a topically-related blog post
        #    (NOT the homepage) to preserve link equity.

        # Token refresh - moderate limit (multi-tab, mobile reconnects)
        location = /api/auth/refresh {
            limit_req zone=token_limit burst=8 nodelay;
            limit_req_status 429;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Auth routes - stricter rate limit to prevent brute-force
        location /api/auth/ {
            limit_req zone=auth_limit burst=4 nodelay;
            limit_req_status 429;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # SSE (Server-Sent Events) - long-lived connections need special handling
        location /api/sse/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE requires: no buffering, long timeouts
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding off;
        }

        # API routes - proxy to active backend
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Webhook routes (higher rate limit for Facebook)
        location /webhook {
            limit_req zone=webhook_limit burst=50 nodelay;

            proxy_pass http://backend_active$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Shopify/Salla onboarding pages are Next.js pages — must hit frontend, not backend
        location = /shopify/onboarding {
            proxy_pass http://frontend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location = /salla/onboarding {
            proxy_pass http://frontend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Shopify integration routes (OAuth, webhooks, GDPR, store API)
        location /shopify/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Salla integration routes (OAuth, webhooks, store API)
        location /salla/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check for backend
        location /health {
            proxy_pass http://backend_active/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # AI Worker routes
        location /ai/ {
            limit_req zone=api_limit burst=10 nodelay;
            
            proxy_pass http://ai_worker_active/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Apple App Site Association (Universal Links)
        location /.well-known/apple-app-site-association {
            proxy_pass http://frontend_active;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            default_type application/json;
        }

        # Frontend (Next.js) - proxy to active frontend
        location / {
            proxy_pass http://frontend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }
    }
}
