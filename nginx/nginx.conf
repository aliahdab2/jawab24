        # page, so it must be carved out of the /zid/ backend prefix below,
        # exactly like /zid/onboarding and /salla/connected.
        location = /zid/embedded {
            # The ?token=<uuid> query is a live merchant credential — log the
            # path only, never the raw request line. See log_format main_noquery.
            access_log /var/log/nginx/access.log main_noquery;
            proxy_pass http://frontend_active;
