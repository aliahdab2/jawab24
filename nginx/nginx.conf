events {
    worker_connections 1024;
}

http {
    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Include upstream configuration (for blue-green deployment)
    include /etc/nginx/upstream.conf;
    
    # Note: keepalive settings are configured in the upstream blocks
    # in upstream.conf (keepalive directive)

    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=100r/s;

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name jawab24.com www.jawab24.com;

        # Health check endpoint (for load balancers)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Allow health checks on HTTP for local smoke tests (localhost/CI only)
        location = /api/health {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://backend_active/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Allow version check on HTTP for deployment verification
        location = /api/version {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://backend_active/version;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ACME challenge for SSL renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name jawab24.com www.jawab24.com;

        # SSL certificates (mounted from Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/jawab24.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jawab24.com/privkey.pem;

        # SSL settings
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://ui-avatars.com https://www.transparenttextures.com data: blob:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://*.sentry.io; frame-src 'self' https://www.facebook.com; object-src 'none'; base-uri 'self'; form-action 'self' https://www.facebook.com;" always;

        # API routes - proxy to active backend
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Webhook routes (higher rate limit for Facebook)
        location /webhook {
            limit_req zone=webhook_limit burst=50 nodelay;
            
            proxy_pass http://backend_active/webhook$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Health check for backend
        location /health {
            proxy_pass http://backend_active/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # AI Worker routes
        location /ai/ {
            limit_req zone=api_limit burst=10 nodelay;
            
            proxy_pass http://ai_worker_active/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Apple App Site Association (Universal Links)
        location /.well-known/apple-app-site-association {
            proxy_pass http://frontend_active;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            default_type application/json;
        }

        # Frontend (Next.js) - proxy to active frontend
        location / {
            proxy_pass http://frontend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }
    }
}
