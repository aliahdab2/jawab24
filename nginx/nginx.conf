events {
    worker_connections 1024;
}

http {
    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Include upstream configuration (for blue-green deployment)
    include /etc/nginx/upstream.conf;
    
    # Note: keepalive settings are configured in the upstream blocks
    # in upstream.conf (keepalive directive)

    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    # Same as `main` but logs the decoded PATH ($uri) instead of the raw request
    # line ($request), so the query string never lands in the access log. Used on
    # routes whose query carries a live credential — the Zid embedded-app entry
    # is framed at /zid/embedded?token=<uuid>, and that UUID opens a merchant
    # session. $request_method/$server_protocol keep the line otherwise identical.
    log_format main_noquery '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=token_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=100r/s;

    # Rate-limit responses use 429 (Too Many Requests) per RFC 6585 — set once for all zones.
    # Clients (browser fetch, axios, FB webhook retry) treat 429 differently from 5xx,
    # so this matters for backoff behavior and Sentry alerting.
    limit_req_status 429;

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name jawab24.com www.jawab24.com;

        # Health check endpoint (for load balancers)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Allow health checks on HTTP for local smoke tests (localhost/CI only)
        location = /api/health {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://backend_active/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # SECURITY: strip client-supplied geo headers. Sanctions enforcement
            # (OFAC) reads these in backend; we are not behind Cloudflare/Vercel,
            # so any inbound copy is a spoofing attempt. Defense in depth: backend
            # also ignores these unless TRUSTED_GEO_HEADER_SOURCE is set.
            proxy_set_header CF-IPCountry "";
            proxy_set_header X-Vercel-IP-Country "";
            proxy_set_header X-Geo-Country "";
            proxy_set_header X-Geo-Region "";
        }

        # Allow version check on HTTP for deployment verification
        location = /api/version {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://backend_active/version;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # SECURITY: strip client-supplied geo headers. Sanctions enforcement
            # (OFAC) reads these in backend; we are not behind Cloudflare/Vercel,
            # so any inbound copy is a spoofing attempt. Defense in depth: backend
            # also ignores these unless TRUSTED_GEO_HEADER_SOURCE is set.
            proxy_set_header CF-IPCountry "";
            proxy_set_header X-Vercel-IP-Country "";
            proxy_set_header X-Geo-Country "";
            proxy_set_header X-Geo-Region "";
        }

        # ACME challenge for SSL renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP to HTTPS (always non-www)
        location / {
            return 301 https://jawab24.com$request_uri;
        }
    }

    # Redirect www to non-www (HTTPS)
    server {
        listen 443 ssl;
        http2 on;
        server_name www.jawab24.com;

        ssl_certificate /etc/letsencrypt/live/jawab24.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jawab24.com/privkey.pem;

        return 301 https://jawab24.com$request_uri;
    }

    # HTTPS server (non-www only)
    server {
        listen 443 ssl;
        http2 on;
        server_name jawab24.com;

        # SSL certificates (mounted from Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/jawab24.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jawab24.com/privkey.pem;

        # SSL settings
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Security headers
        #
        # ⚠️ SHARED INFRASTRUCTURE — these apply to EVERY response on the domain.
        #
        # X-Frame-Options was deliberately REMOVED (2026-08-11) and replaced by
        # the CSP `frame-ancestors` directive below. Reason: the Zid Embedded App
        # (docs.zid.sa/embedded-apps) runs the dashboard inside an iframe served
        # by dashboard.zid.sa, and XFO cannot express an allowlist — it is
        # all-or-nothing, so SAMEORIGIN blocked the integration outright.
        # `frame-ancestors` is the standards-track replacement, is honoured by
        # every browser we support (Chrome 40+, Firefox 33+, Safari 10+), and
        # OVERRIDES XFO wherever both are present. Anti-clickjacking protection
        # is therefore unchanged for every origin except the two Zid PRODUCTION
        # hosts explicitly named below. Zid's `*.zid.dev` sandbox is deliberately
        # NOT allowed here: this is the production config, and a wildcard over a
        # dev domain would let any *.zid.dev subdomain frame the live dashboard.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # WhatsApp Embedded Signup needs the Facebook JS SDK, which is not bundled
        # globally (the rest of the app uses redirect OAuth). Three sources, all
        # verified against the live loader at connect.facebook.net/en_US/sdk.js:
        #   script-src  connect.facebook.net  — sdk.js AND the /en_US/bundle/… chunk it injects
        #   frame-src   staticxx.facebook.com — the xd_arbiter cross-domain frame built during FB.init
        #   connect-src graph.facebook.com    — Graph XHR (already trusted in img-src)
        # Omitting connect.facebook.net from script-src fires script.onerror, which
        # surfaces as "Failed to load Facebook SDK" for every merchant, every browser.
        #
        # Google Ads audience/conversion signals (gtag.js, measured 2026-08-18).
        # The Google tag posts to two endpoints that were blocked outright:
        #   connect-src ad.doubleclick.net  - fetch POST to /ccm/s/collect
        #   connect-src www.google.com      - fetch POST to /ccm/collect
        #   img-src     www.google.com      - the <img> beacon gtag falls back to
        #                                     when the fetch is unavailable
        # Both directives are needed because a fetch is connect-src and an image
        # is img-src for the SAME URL - the backblazeb2 note below is that trap
        # in the other direction.
        #
        # img-src www.googletagmanager.com is the same trap a THIRD time: the
        # host was allowed in script-src (gtag.js loads fine) but the tag also
        # fires an image beacon to itself, which img-src governs. Lighthouse's
        # errors-in-console audit did NOT surface this one - Google Ads ->
        # Tools -> Data manager -> Google tag -> diagnostics did, naming the
        # directive and the host outright. Treat that panel as the authority on
        # what the tag needs; the browser console only shows what happened to
        # fire during one page load.
        #
        # Nothing here is speculative: every host was named by one of those two
        # instruments. Google's published allow-list is longer (notably
        # www.googleadservices.com and googleads.g.doubleclick.net for a
        # conversion tag). Do NOT pre-add them - re-read the diagnostics panel
        # after a deploy and add what it actually reports.
        # WARNING: Google may ping a COUNTRY domain instead (www.google.com.ly,
        # www.google.se, ...) depending on the visitor, and no wildcard covers
        # those - *.google.com does NOT match google.com.ly. If audiences look
        # under-counted, run `npx lighthouse https://jawab24.com/ --output=json`
        # and read the `errors-in-console` audit: a blocked ccTLD appears there
        # verbatim, and gets added here.
        # NOTE: the app has no AW- conversion tag (frontend/src/pages/_app.tsx
        # configures GA4 only), so this enables the GA4<->Ads link: remarketing
        # audiences and imported conversions. A dedicated Google Ads conversion
        # tag would be a separate change and may also need
        # www.googleadservices.com in script-src and img-src.
        #
        # backblazeb2.com is needed in BOTH img-src and connect-src. Merchant media
        # (post-suggestion images, Post Reply trigger images) is DISPLAYED via <img>,
        # which img-src covers — but "Download image" reads the same URL with fetch()
        # to hand a Blob to the share sheet, and a fetch is connect-src. Listing the
        # host only in img-src is why the preview rendered while every download threw
        # "TypeError: Failed to fetch" (JAWAB24-FRONTEND-31). The bucket must also
        # send Access-Control-Allow-Origin — see backend/docs/OBJECT_STORAGE.md.
        #
        # Stripe needs THREE host groups, and they are NOT interchangeable
        # (docs.stripe.com/security/guide, "Content Security Policy"):
        #   script-src / frame-src  js.stripe.com + *.js.stripe.com — Stripe.js and
        #                           the Payment Element iframes (the visible card form)
        #   connect-src             api.stripe.com — the confirmPayment()/retrieve*()
        #                           XHR the page itself makes when the merchant pays
        #   *-src                   checkout.stripe.com / hooks.stripe.com — the
        #                           HOSTED checkout surface and 3DS redirect frames
        # api.stripe.com was dropped in 6d5ce61c (2026-03-26) when connect-src was
        # "completed" with checkout.stripe.com instead — the hosted host, cargo-culted
        # onto the embedded flow. From then on the card form RENDERED (frame/script
        # hosts were fine) but every embedded confirm was refused by the browser:
        # pay did nothing, no error surfaced anywhere (the throw was swallowed in
        # checkout.tsx), nothing reached Stripe or Sentry. Every embedded checkout
        # attempt 03-26→08-20 died this way (Feras 07-25 — misattributed to Brave
        # Shields at the time; the owner 08-18; Nourva 08-20 ×2). Verified live on
        # 2026-08-20: fetch to api.stripe.com from jawab24.com/pricing → "Refused to
        # connect because it violates the document's Content Security Policy".
        # Pinned by backend/test/nginxCspStripe.test.ts.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://js.stripe.com https://*.js.stripe.com https://checkout.stripe.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://ui-avatars.com https://www.transparenttextures.com https://www.google.com https://www.googletagmanager.com https://graph.facebook.com https://*.fbcdn.net https://*.fbsbx.com https://*.cdninstagram.com https://*.stripe.com https://*.backblazeb2.com data: blob:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://ad.doubleclick.net https://www.google.com https://*.sentry.io https://api.stripe.com https://checkout.stripe.com https://graph.facebook.com https://*.backblazeb2.com; frame-src 'self' https://www.facebook.com https://staticxx.facebook.com https://js.stripe.com https://*.js.stripe.com https://checkout.stripe.com https://hooks.stripe.com; frame-ancestors 'self' https://dashboard.zid.sa https://web.zid.sa; object-src 'none'; base-uri 'self'; form-action 'self' https://www.facebook.com;" always;

        # ─────────────────────────────────────────────────────────────────
        # Legacy WordPress / French content cleanup (SEO)
        # The domain previously hosted a French WordPress site ("Sujet24").
        # Old French URLs are still indexed by Google. We respond with
        # 410 Gone so Google removes them from the index faster than 404,
        # and we 301-redirect the most common attack/crawl paths to /.
        # ─────────────────────────────────────────────────────────────────

        # 1) WordPress dated archives:  /YYYY/...  /YYYY/MM/...  /YYYY/MM/DD/slug/
        location ~ "^/(19|20)\d{2}(/|$)" {
            add_header Content-Type "text/html; charset=utf-8" always;
            return 410 "<!doctype html><meta charset=utf-8><title>Gone</title><h1>410 Gone</h1><p>This page has been permanently removed. Visit <a href=\"https://jawab24.com/\">jawab24.com</a>.</p>";
        }

        # 2) French slug patterns (old article slugs that don't collide with current routes)
        #    Articles & question words: /les-, /la-, /le-, /des-, /du-, /une-, /un-,
        #                               /quel(le)(s)?-, /qui-, /que-, /quand-,
        #                               /comment-, /pourquoi-, /combien-
        #    Content-category nouns observed in the legacy WordPress index:
        #                               /sourire-, /histoire-, /recette(s)?-, /sport-,
        #                               /sante-, /cuisine-, /voyage-, /astronomie-,
        #                               /meilleur(e)?(s)?-
        #    These prefixes do not collide with any current route — current public
        #    routes use /blog/, /en/, /compare/, /integrations/, /pricing, /login,
        #    /privacy, /terms, /data-deletion, /contact, /what-is-jawab24.
        location ~* ^/(les|la|le|des|du|une|un|quel(le)?s?|qui|que|quand|comment|pourquoi|combien|sourire|histoire|recettes?|sport|sante|cuisine|voyage|astronomie|meilleure?s?)- {
            add_header Content-Type "text/html; charset=utf-8" always;
            return 410 "<!doctype html><meta charset=utf-8><title>Gone</title><h1>410 Gone</h1><p>This page has been permanently removed. Visit <a href=\"https://jawab24.com/\">jawab24.com</a>.</p>";
        }

        # 3) WordPress core paths (taxonomy, feeds, admin, probes) — also leftover from old site
        location ~* ^/(category|tag|author|feed|comments-feed)(/|$) {
            return 410;
        }
        location ~* ^/(wp-admin|wp-includes|wp-content|wp-json)(/|$) {
            return 410;
        }
        location ~* ^/(wp-login\.php|xmlrpc\.php|wp-config\.php)$ {
            return 410;
        }

        # 3b) Arabic-encoded legacy slugs (UTF-8 Arabic = leading bytes 0xD8 / 0xD9)
        # Current routes use ASCII paths (/blog/..., /en/..., /api/...), so any
        # path whose first character after `/` is non-ASCII is from the old
        # WordPress site. nginx decodes %XX in the URI before location matching,
        # so we must match the raw decoded bytes, not the literal "%D8" text.
        location ~ "^/[\xD8\xD9]" {
            add_header Content-Type "text/html; charset=utf-8" always;
            return 410 "<!doctype html><meta charset=utf-8><title>Gone</title><h1>410 Gone</h1><p>This page has been permanently removed. Visit <a href=\"https://jawab24.com/\">jawab24.com</a>.</p>";
        }

        # 4) (Removed) Old French content has no topical relevance to the current SaaS.
        #    Redirecting unrelated URLs to "/" is treated as a soft-404 by Google
        #    (https://developers.google.com/search/docs/crawling-indexing/301-redirects).
        #    These URLs now fall through to rule #2 above and return 410 Gone.
        #    If GSC → Links ever shows external backlinks to a specific legacy URL,
        #    add a `location =` block here that 301s to a topically-related blog post
        #    (NOT the homepage) to preserve link equity.

        # Token refresh - moderate limit (multi-tab, mobile reconnects)
        location = /api/auth/refresh {
            limit_req zone=token_limit burst=8 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SECURITY: strip client-supplied geo headers. Sanctions enforcement
            # (OFAC) reads these in backend; we are not behind Cloudflare/Vercel,
            # so any inbound copy is a spoofing attempt. Defense in depth: backend
            # also ignores these unless TRUSTED_GEO_HEADER_SOURCE is set.
            proxy_set_header CF-IPCountry "";
            proxy_set_header X-Vercel-IP-Country "";
            proxy_set_header X-Geo-Country "";
            proxy_set_header X-Geo-Region "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Auth routes - stricter rate limit to prevent brute-force
        location /api/auth/ {
            limit_req zone=auth_limit burst=4 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SECURITY: strip client-supplied geo headers. Sanctions enforcement
            # (OFAC) reads these in backend; we are not behind Cloudflare/Vercel,
            # so any inbound copy is a spoofing attempt. Defense in depth: backend
            # also ignores these unless TRUSTED_GEO_HEADER_SOURCE is set.
            proxy_set_header CF-IPCountry "";
            proxy_set_header X-Vercel-IP-Country "";
            proxy_set_header X-Geo-Country "";
            proxy_set_header X-Geo-Region "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # SSE (Server-Sent Events) - long-lived connections need special handling
        location /api/sse/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SECURITY: strip client-supplied geo headers. Sanctions enforcement
            # (OFAC) reads these in backend; we are not behind Cloudflare/Vercel,
            # so any inbound copy is a spoofing attempt. Defense in depth: backend
            # also ignores these unless TRUSTED_GEO_HEADER_SOURCE is set.
            proxy_set_header CF-IPCountry "";
            proxy_set_header X-Vercel-IP-Country "";
            proxy_set_header X-Geo-Country "";
            proxy_set_header X-Geo-Region "";

            # SSE requires: no buffering, long timeouts
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding off;
        }

        # API routes - proxy to active backend
        # OG image generator is a Next.js Pages API route — must hit frontend.
        # Exact-match location takes precedence over the /api/ prefix block below.
        location = /api/og {
            proxy_pass http://frontend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SECURITY: strip client-supplied geo headers. Sanctions enforcement
            # (OFAC) reads these in backend; we are not behind Cloudflare/Vercel,
            # so any inbound copy is a spoofing attempt. Defense in depth: backend
            # also ignores these unless TRUSTED_GEO_HEADER_SOURCE is set.
            proxy_set_header CF-IPCountry "";
            proxy_set_header X-Vercel-IP-Country "";
            proxy_set_header X-Geo-Country "";
            proxy_set_header X-Geo-Region "";
        }

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SECURITY: strip client-supplied geo headers. Sanctions enforcement
            # (OFAC) reads these in backend; we are not behind Cloudflare/Vercel,
            # so any inbound copy is a spoofing attempt. Defense in depth: backend
            # also ignores these unless TRUSTED_GEO_HEADER_SOURCE is set.
            proxy_set_header CF-IPCountry "";
            proxy_set_header X-Vercel-IP-Country "";
            proxy_set_header X-Geo-Country "";
            proxy_set_header X-Geo-Region "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Webhook routes (higher rate limit for Facebook)
        location /webhook {
            limit_req zone=webhook_limit burst=50 nodelay;

            proxy_pass http://backend_active$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SECURITY: strip client-supplied geo headers. Sanctions enforcement
            # (OFAC) reads these in backend; we are not behind Cloudflare/Vercel,
            # so any inbound copy is a spoofing attempt. Defense in depth: backend
            # also ignores these unless TRUSTED_GEO_HEADER_SOURCE is set.
            proxy_set_header CF-IPCountry "";
            proxy_set_header X-Vercel-IP-Country "";
            proxy_set_header X-Geo-Country "";
            proxy_set_header X-Geo-Region "";
        }

        # Shopify/Salla/Zid merchant-facing pages are Next.js pages — must hit frontend,
        # not backend. These exact-match blocks MUST stay above the platform prefix
        # blocks below (`location /salla/` etc.), which would otherwise swallow them and
        # hand the merchant a 404. Every Next.js page under a platform prefix needs an
        # entry here — adding a page without one is invisible until a merchant lands on it.
        location = /shopify/onboarding {
            proxy_pass http://frontend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SECURITY: strip client-supplied geo headers. Sanctions enforcement
            # (OFAC) reads these in backend; we are not behind Cloudflare/Vercel,
            # so any inbound copy is a spoofing attempt. Defense in depth: backend
            # also ignores these unless TRUSTED_GEO_HEADER_SOURCE is set.
            proxy_set_header CF-IPCountry "";
            proxy_set_header X-Vercel-IP-Country "";
            proxy_set_header X-Geo-Country "";
            proxy_set_header X-Geo-Region "";
        }

        location = /salla/onboarding {
            proxy_pass http://frontend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SECURITY: strip client-supplied geo headers. Sanctions enforcement
            # (OFAC) reads these in backend; we are not behind Cloudflare/Vercel,
            # so any inbound copy is a spoofing attempt. Defense in depth: backend
            # also ignores these unless TRUSTED_GEO_HEADER_SOURCE is set.
            proxy_set_header CF-IPCountry "";
            proxy_set_header X-Vercel-IP-Country "";
            proxy_set_header X-Geo-Country "";
            proxy_set_header X-Geo-Region "";
        }

        # Salla Easy-Mode landing page (the App URL Salla loads after install).
        location = /salla/connected {
            proxy_pass http://frontend_active;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SECURITY: strip client-supplied geo headers. Sanctions enforcement
