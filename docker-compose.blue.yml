# Blue environment overlay for blue-green deployment

services:
  backend-blue:
    image: jawab24-backend:latest
    container_name: jawab24-backend-blue
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/backend.env
    environment:
      - NODE_ENV=production
      - DEPLOY_ENV=blue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jawab24-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend-blue:
    image: jawab24-frontend:latest
    container_name: jawab24-frontend-blue
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_FB_APP_ID=${NEXT_PUBLIC_FB_APP_ID:-}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://jawab24.com/api}
    restart: unless-stopped
    env_file:
      - ./env/frontend.env
    environment:
      - NODE_ENV=production
      - DEPLOY_ENV=blue
    networks:
      - jawab24-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-worker-blue:
    image: jawab24-ai-worker:latest
    container_name: jawab24-ai-worker-blue
    build:
      context: .
      dockerfile: ai-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/ai.env
    environment:
      - NODE_ENV=production
      - DEPLOY_ENV=blue
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jawab24-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



