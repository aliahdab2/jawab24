name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # ==========================================
  # Step 1: Verify secrets and scripts exist
  # ==========================================
  preflight:
    name: "1️⃣ Verify Secrets"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for required secrets
        run: |
          echo "🔍 Checking required GitHub secrets..."

          MISSING_SECRETS=0

          # Critical secrets that MUST be set
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "❌ SERVER_SSH_KEY is not set!"
            MISSING_SECRETS=1
          else
            echo "✅ SERVER_SSH_KEY is set"
          fi

          if [ -z "${{ secrets.FACEBOOK_APP_ID }}" ]; then
            echo "⚠️  FACEBOOK_APP_ID not set (may cause deployment issues)"
          else
            echo "✅ FACEBOOK_APP_ID is set"
          fi

          if [ $MISSING_SECRETS -eq 1 ]; then
            echo ""
            echo "❌ CRITICAL: Missing required secrets!"
            echo "   Go to: Repository Settings → Secrets → Actions"
            exit 1
          fi

          echo "✅ All critical secrets are configured"

      - name: Validate deployment scripts exist
        run: |
          echo "🔍 Checking deployment scripts..."

          REQUIRED_SCRIPTS=(
            "scripts/deploy-blue-green.sh"
            "scripts/check-env.sh"
            "scripts/test-routes.sh"
            "scripts/health-check.sh"
          )

          MISSING=0
          for script in "${REQUIRED_SCRIPTS[@]}"; do
            if [ ! -f "$script" ]; then
              echo "❌ Missing: $script"
              MISSING=1
            else
              echo "✅ Found: $script"
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "❌ Missing required deployment scripts!"
            exit 1
          fi

          echo "✅ All deployment scripts found"

  # ==========================================
  # Step 2: Run all checks (shared script)
  # ==========================================
  checks:
    name: "2️⃣ Run All Checks"
    runs-on: ubuntu-latest
    needs: preflight

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoreply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check OpenAI SDK version parity
        run: npm run check:openai-sync

      - name: Run all checks
        run: |
          chmod +x scripts/pre-deploy-check.sh
          ./scripts/pre-deploy-check.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/autoreply_test
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: whsec_test_secret
          JWT_SECRET: test_jwt_secret_for_ci
          FRONTEND_URL: http://localhost:3001
          NODE_ENV: test
          NEXT_PUBLIC_API_URL: https://jawab24.com/api
          NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backend-build
          path: backend/dist
          retention-days: 1

      - name: Upload ai-worker build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ai-worker-build
          path: ai-worker/dist
          retention-days: 1

  # ==========================================
  # Step 3a: Lighthouse CI (parallel with Docker)
  # Audits public pages for accessibility, CLS, and performance.
  # Hard errors (block CI): accessibility < 90, CLS > 0.1
  # Soft warnings (visible, don't block): performance < 70, best-practices < 80, SEO < 80, LCP > 5s, FCP > 3s
  # ==========================================
  lighthouse:
    name: "3️⃣a Lighthouse CI"
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build here rather than reuse a cross-job artifact: output:'standalone'
      # relocates the runnable build under .next/standalone, so uploading
      # frontend/.next produced an empty artifact. Self-building keeps the job
      # reliable and self-contained.
      - name: Build frontend (standalone)
        working-directory: frontend
        run: npx next build
        env:
          CI: 'true'
          NEXT_PUBLIC_API_URL: https://jawab24.com/api
          NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          # Placeholder is fine — Lighthouse only renders public pages; the key is
          # baked into the client bundle, not validated at build time.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

      - name: Assemble standalone server assets
        working-directory: frontend
        # output:'standalone' emits server.js but not static/ or public/ — copy them in (same as the E2E setup).
        run: |
          cp -r .next/static .next/standalone/frontend/.next/static
          cp -r public .next/standalone/frontend/public

      - name: Start frontend server
        working-directory: frontend
        # `next start` does NOT support output:'standalone' — run the emitted server.js (same as Playwright E2E).
        run: PORT=3001 node .next/standalone/frontend/server.js &
        env:
          PORT: 3001
          NEXT_PUBLIC_API_URL: https://jawab24.com/api
          NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}

      - name: Wait for frontend to be ready
        run: |
          echo "⏳ Waiting for frontend to start on port 3001..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ Frontend ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Frontend failed to start in 30 seconds"
              exit 1
            fi
            sleep 1
          done

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.x autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

  # ==========================================
  # Step 3b: Build and test Docker images
  # ==========================================
  docker:
    name: "3️⃣ Build Docker Images"
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: jawab24-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ai-worker/Dockerfile
          push: false
          load: true
          tags: jawab24-ai-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: jawab24-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # Smoke Test - Actually run containers
      # ==========================================
      - name: Smoke Test - Backend Container
        run: |
          echo "🧪 Testing backend container can start..."

          # Clean up any existing test container
          docker rm -f backend-test 2>/dev/null || true

          # Start backend with all required env vars for smoke test
          # SKIP_MIGRATIONS=true skips DB connection at startup
          # This tests that code loads without import/require errors
          docker run -d --name backend-test \
            -e DATABASE_URL=postgres://test:test@localhost:5432/test \
            -e JWT_SECRET=this_is_a_test_jwt_secret_that_is_at_least_32_chars_long \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e SKIP_MIGRATIONS=true \
            -e FACEBOOK_APP_ID=test_app_id \
            -e FACEBOOK_APP_SECRET=test_app_secret \
            -e FACEBOOK_REDIRECT_URI=http://localhost:3001/auth/callback \
            -e FACEBOOK_WEBHOOK_VERIFY_TOKEN=test_webhook_token \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e REDIS_PASSWORD=ci_smoke_test_redis_password \
            -e RESEND_API_KEY=re_ci_smoke_test_dummy_key \
            -e COOKIE_SECRET=test_cookie_secret_at_least_32_chars_long_for_ci_smoke_test \
            jawab24-backend:test

          # Wait a moment for startup
          sleep 8

          # Check if container is still running (crashed = not running)
          if docker ps | grep -q backend-test; then
            echo "✅ Backend container started successfully!"
            docker logs backend-test --tail 20
            docker stop backend-test
            docker rm backend-test
          else
            echo "❌ Backend container crashed on startup!"
            echo ""
            echo "📋 Container logs:"
            docker logs backend-test 2>&1
            docker rm backend-test 2>/dev/null || true
            exit 1
          fi

      - name: Performance Benchmark — Backend Health Endpoints
        run: |
          echo "⚡ Running performance benchmark against backend..."

          docker rm -f backend-perf 2>/dev/null || true

          docker run -d --name backend-perf \
            -p 3000:3000 \
            -e DATABASE_URL=postgres://test:test@localhost:5432/test \
            -e JWT_SECRET=this_is_a_test_jwt_secret_that_is_at_least_32_chars_long \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e SKIP_MIGRATIONS=true \
            -e FACEBOOK_APP_ID=test_app_id \
            -e FACEBOOK_APP_SECRET=test_app_secret \
            -e FACEBOOK_REDIRECT_URI=http://localhost:3001/auth/callback \
            -e FACEBOOK_WEBHOOK_VERIFY_TOKEN=test_webhook_token \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e REDIS_PASSWORD=ci_smoke_test_redis_password \
            -e RESEND_API_KEY=re_ci_smoke_test_dummy_key \
            -e COOKIE_SECRET=test_cookie_secret_at_least_32_chars_long_for_ci_smoke_test \
            jawab24-backend:test

          echo "Waiting for backend to be ready..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Backend is ready after ${i}s"
              break
            fi
            sleep 1
          done

          node scripts/perf-benchmark.js http://localhost:3000

          docker stop backend-perf
          docker rm backend-perf

      - name: Smoke Test - AI Worker Container
        run: |
          echo "🧪 Testing AI worker container can start..."

          docker rm -f ai-worker-test 2>/dev/null || true

          docker run -d --name ai-worker-test \
            -e REDIS_URL=redis://localhost:6379 \
            -e NODE_ENV=production \
            jawab24-ai-worker:test

          sleep 8

          if docker ps | grep -q ai-worker-test; then
            echo "✅ AI Worker container started successfully!"
            docker logs ai-worker-test --tail 20
            docker stop ai-worker-test
            docker rm ai-worker-test
          else
            echo "❌ AI Worker container crashed on startup!"
            echo ""
            echo "📋 Container logs:"
            docker logs ai-worker-test 2>&1
            docker rm ai-worker-test 2>/dev/null || true
            exit 1
          fi

      - name: Smoke Test - Frontend Container
        run: |
          echo "🧪 Testing frontend container can start..."

          docker rm -f frontend-test 2>/dev/null || true

          docker run -d --name frontend-test \
            -e NODE_ENV=production \
            -e NEXT_PUBLIC_API_URL=http://localhost:3000 \
            jawab24-frontend:test

          sleep 8

          if docker ps | grep -q frontend-test; then
            echo "✅ Frontend container started successfully!"
            docker logs frontend-test --tail 20
            docker stop frontend-test
            docker rm frontend-test
          else
            echo "❌ Frontend container crashed on startup!"
            echo ""
            echo "📋 Container logs:"
            docker logs frontend-test 2>&1
            docker rm frontend-test 2>/dev/null || true
            exit 1
          fi

  # ==========================================
  # Step 4: Final status check
  # ==========================================
  ci-summary:
    name: "4️⃣ Ready to Deploy?"
    runs-on: ubuntu-latest
    needs: [preflight, checks, docker, lighthouse]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Check if any job failed
          if [ "${{ needs.preflight.result }}" = "failure" ] || \
             [ "${{ needs.checks.result }}" = "failure" ] || \
             [ "${{ needs.docker.result }}" = "failure" ] || \
             [ "${{ needs.lighthouse.result }}" = "failure" ]; then
            echo "❌ CI CHECKS FAILED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Preflight:  ${{ needs.preflight.result }}"
            echo "Checks:     ${{ needs.checks.result }}"
            echo "Docker:     ${{ needs.docker.result }}"
            echo "Lighthouse: ${{ needs.lighthouse.result }}"
            echo ""
            echo "🚫 Deployment has been BLOCKED"
            echo "Please fix the failing checks above before deploying."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          else
            echo "✅ ALL CI CHECKS PASSED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Preflight:  ✅"
            echo "Checks:     ✅"
            echo "Docker:     ✅"
            echo "Lighthouse: ✅"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "🚀 DEPLOYMENT STARTING..."
            echo ""
            echo "The 'Deploy' workflow will now run automatically."
            echo "Check the Actions tab for deployment progress."
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          fi
