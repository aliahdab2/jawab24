name: CI - Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  # ==========================================
  # Setup & Install (Cache)
  # ==========================================
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

  # ==========================================
  # Backend Tests & Build
  # ==========================================
  backend:
    name: Backend - Test & Build
    runs-on: ubuntu-latest
    needs: setup
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoreply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run build --workspace=jawab24-backend

      - name: Run linter
        run: npm run lint --workspace=jawab24-backend

      # Tests are skipped for now as they need DB setup which might be tricky in workspaces without specific config
      # - name: Run tests
      #   run: npm test --workspace=jawab24-backend
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist
          retention-days: 1

  # ==========================================
  # AI Worker Tests & Build
  # ==========================================
  ai-worker:
    name: AI Worker - Test & Build
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run build --workspace=jawab24-ai-worker

      - name: Run linter
        run: npm run lint --workspace=jawab24-ai-worker

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-worker-build
          path: ai-worker/dist
          retention-days: 1

  # ==========================================
  # Frontend Tests & Build
  # ==========================================
  frontend:
    name: Frontend - Test & Build
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build --workspace=jawab24-frontend
        env:
          NEXT_PUBLIC_API_URL: https://jawab24.com/api
          NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}

      - name: Run linter
        run: npm run lint --workspace=jawab24-frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 1

  # ==========================================
  # Docker Build Test
  # ==========================================
  docker:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [backend, ai-worker, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: jawab24-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ai-worker/Dockerfile
          push: false
          tags: jawab24-ai-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: jawab24-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Summary
  # ==========================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend, ai-worker, frontend, docker]
    if: success()
    
    steps:
      - name: CI Passed
        run: |
          echo "✅ All CI checks passed!"
          echo "Backend: ✅"
          echo "AI Worker: ✅"
          echo "Frontend: ✅"
          echo "Docker: ✅"
