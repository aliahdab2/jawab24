name: Update Visual Snapshots

# Manually-triggered workflow that regenerates the Linux Playwright visual
# baselines for `frontend/e2e/visual.spec.ts` and opens a PR with the result.
#
# When to use: a UI change shifted the bottom nav / header / spacing and the
# *-chromium-linux.png baselines are now stale (CI fails with "Expected an
# image AxB, received AxC"). Running this workflow refreshes the baselines
# byte-identically against the same ubuntu-latest runner CI uses.
#
# Trigger: Actions → "Update Visual Snapshots" → Run workflow → pick branch.

on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Filter (Playwright --grep). Leave blank to refresh all visual tests.'
        required: false
        default: ''

env:
  NODE_VERSION: '22'

jobs:
  update-snapshots:
    name: Regenerate Linux baselines
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need full history so we can push a branch.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: cd packages/shared && npm run build

      - name: Build frontend (standalone)
        run: cd frontend && CI=true npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4999/api
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}

      - name: Stage standalone static + public dirs
        run: |
          cp -r frontend/.next/static frontend/.next/standalone/frontend/.next/static
          cp -r frontend/public frontend/.next/standalone/frontend/public

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Update visual snapshots
        run: |
          cd frontend
          GREP_ARG=""
          if [ -n "${{ inputs.grep }}" ]; then
            GREP_ARG="--grep ${{ inputs.grep }}"
          fi
          CI=true npx playwright test e2e/visual.spec.ts --update-snapshots $GREP_ARG

      - name: Check for changes
        id: diff
        run: |
          git add frontend/e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changes — exiting cleanly."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'test(visual): refresh Linux Playwright baselines'
          branch: chore/update-visual-snapshots
          delete-branch: true
          title: 'test(visual): refresh Linux Playwright baselines'
          body: |
            Auto-generated by `.github/workflows/update-visual-snapshots.yml`.

            Regenerated `*-chromium-linux.png` baselines on `ubuntu-latest` so
            CI's visual-regression checks match the current UI.

            Triggered from branch: `${{ github.ref_name }}`
            Grep filter: `${{ inputs.grep || '(all)' }}`
          add-paths: frontend/e2e/visual.spec.ts-snapshots/**
