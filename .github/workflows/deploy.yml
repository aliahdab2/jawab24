name: Deploy to Production

on:
  # Only trigger AFTER CI workflow completes successfully
  workflow_run:
    workflows: ["CI - Test & Build"]
    types:
      - completed
    branches: [main]
  
  # Allow manual deployment (for emergencies or hotfixes)
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: 'Skip health checks after deployment'
        required: false
        default: 'false'
        type: boolean
      force_deploy:
        description: 'Force deploy even if CI is running (use with caution)'
        required: false
        default: 'false'
        type: boolean

env:
  SERVER_HOST: 91.99.95.196
  SERVER_USER: root
  DEPLOY_PATH: /var/www/jawab24

jobs:
  deploy:
    name: 🚀 Deploy (Zero Downtime)
    runs-on: ubuntu-latest
    # Deploy ONLY when:
    # 1. Manual trigger (workflow_dispatch)
    # 2. CI workflow completed successfully (workflow_run)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    
    steps:
      - name: 📋 Deployment Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 JAWAB24 BLUE-GREEN DEPLOYMENT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📅 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🔀 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo "🖥️  Server: ${{ env.SERVER_HOST }}"
          echo "🔄 Strategy: Blue-Green (Zero Downtime)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 🔍 Validate Migrations
        run: |
          # Install only what's needed for validation (fast)
          npm ci --workspace=jawab24-backend --ignore-scripts
          cd backend
          npx ts-node scripts/validate-migrations.ts
          echo "✅ All migrations validated"

      - name: 🔐 Pre-deployment Backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            echo "📸 Creating backup point..."
            BACKUP_COMMIT=$(git rev-parse HEAD)
            echo "$BACKUP_COMMIT" > .last_successful_deploy
            
            # Save current active environment
            if [ -f .active-env ]; then
              cp .active-env .last_active_env
            fi
            
            echo "✅ Backup: $BACKUP_COMMIT"

      - name: 🐳 Blue-Green Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📥 STEP 1: Pulling latest code"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            git fetch origin main
            git reset --hard origin/main
            
            # Save version info for /api/version endpoint
            git rev-parse HEAD > VERSION
            date -u '+%Y-%m-%dT%H:%M:%SZ' > .deploy-time
            
            echo "✅ Code updated to: $(git rev-parse --short HEAD)"
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🗄️  STEP 1.5: Running database migrations"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Ensure postgres is running
            docker-compose up -d postgres
            sleep 5
            
            # Create migrations tracking directory
            mkdir -p .migrations
            
            # Run any new SQL migrations from backend/drizzle/
            for migration in backend/drizzle/*.sql; do
              if [ -f "$migration" ]; then
                MIGRATION_NAME=$(basename "$migration")
                # Check if migration was already applied (using a simple marker file)
                if [ ! -f ".migrations/$MIGRATION_NAME.done" ]; then
                  echo "   📦 Applying: $MIGRATION_NAME"
                  # Copy migration to container and run it
                  docker cp "$migration" jawab24-postgres:/tmp/migration.sql
                  if docker exec jawab24-postgres psql -U postgres -d jawab24 -f /tmp/migration.sql 2>&1; then
                    touch ".migrations/$MIGRATION_NAME.done"
                    echo "   ✅ Applied: $MIGRATION_NAME"
                  else
                    echo "   ⚠️  Migration may have been applied already (tables exist)"
                    touch ".migrations/$MIGRATION_NAME.done"
                  fi
                  docker exec jawab24-postgres rm -f /tmp/migration.sql
                else
                  echo "   ⏭️  Already applied: $MIGRATION_NAME"
                fi
              fi
            done
            
            echo "✅ Migrations complete"
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔍 STEP 2: Determine deployment target"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Get current active environment
            if [ -f .active-env ]; then
              ACTIVE_ENV=$(cat .active-env)
            else
              ACTIVE_ENV="blue"
              echo "blue" > .active-env
            fi
            
            # Determine target environment
            if [ "$ACTIVE_ENV" == "blue" ]; then
              DEPLOY_ENV="green"
            else
              DEPLOY_ENV="blue"
            fi
            
            echo "📍 Current active: $ACTIVE_ENV"
            echo "🎯 Deploying to: $DEPLOY_ENV"
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🏗️  STEP 3: Building Docker images"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Load frontend env vars
            if [ -f ./env/frontend.env ]; then
              export $(grep -v '^#' ./env/frontend.env | xargs)
            fi
            
            # Build images with --no-cache to ensure fresh code is used
            # This is critical because Docker layer caching can skip COPY commands
            # if package.json hasn't changed, resulting in stale frontend/backend code
            docker-compose -f docker-compose.yml -f docker-compose.$DEPLOY_ENV.yml build --no-cache --parallel
            echo "✅ Images built (fresh, no cache)"
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 STEP 4: Starting $DEPLOY_ENV environment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Ensure shared services are running
            docker-compose up -d postgres redis nginx
            
            # Start new environment
            docker-compose -f docker-compose.yml -f docker-compose.$DEPLOY_ENV.yml up -d \
              backend-$DEPLOY_ENV frontend-$DEPLOY_ENV ai-worker-$DEPLOY_ENV
            
            echo "✅ $DEPLOY_ENV containers started"
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⏳ STEP 5: Container Startup Verification"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Quick check: Did containers crash immediately?
            sleep 10
            echo "🔍 Checking if containers started without crashing..."
            
            # Check if backend crashed on startup (catches ESM/require errors)
            if ! docker ps | grep -q "jawab24-backend-$DEPLOY_ENV"; then
              echo "❌ Backend container crashed on startup!"
              echo ""
              echo "📋 Last 50 lines of backend logs:"
              docker logs jawab24-backend-$DEPLOY_ENV --tail 50 2>&1 || echo "No logs"
              echo ""
              echo "🚫 ABORTING DEPLOYMENT - Backend failed to start"
              exit 1
            fi
            echo "   ✅ Backend container is running"
            
            # Check if frontend crashed
            if ! docker ps | grep -q "jawab24-frontend-$DEPLOY_ENV"; then
              echo "❌ Frontend container crashed on startup!"
              docker logs jawab24-frontend-$DEPLOY_ENV --tail 50 2>&1 || echo "No logs"
              exit 1
            fi
            echo "   ✅ Frontend container is running"
            
            # Check if AI worker crashed
            if ! docker ps | grep -q "jawab24-ai-worker-$DEPLOY_ENV"; then
              echo "⚠️  AI Worker container not running (may be optional)"
              docker logs jawab24-ai-worker-$DEPLOY_ENV --tail 20 2>&1 || echo "No logs"
            else
              echo "   ✅ AI Worker container is running"
            fi
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⏳ STEP 5b: Waiting for health checks"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Wait for containers to be healthy
            MAX_WAIT=60
            WAITED=0
            while [ $WAITED -lt $MAX_WAIT ]; do
              BACKEND_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' jawab24-backend-$DEPLOY_ENV 2>/dev/null || echo "starting")
              FRONTEND_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' jawab24-frontend-$DEPLOY_ENV 2>/dev/null || echo "starting")
              
              echo "   Backend: $BACKEND_HEALTH, Frontend: $FRONTEND_HEALTH"
              
              if [ "$BACKEND_HEALTH" == "healthy" ] && [ "$FRONTEND_HEALTH" == "healthy" ]; then
                echo "✅ All containers healthy!"
                break
              fi
              
              # Check if container crashed during health check wait
              if ! docker ps | grep -q "jawab24-backend-$DEPLOY_ENV"; then
                echo "❌ Backend crashed during startup!"
                docker logs jawab24-backend-$DEPLOY_ENV --tail 50 2>&1
                exit 1
              fi
              
              if [ $WAITED -ge $MAX_WAIT ]; then
                echo "❌ Health check timeout!"
                echo ""
                echo "📋 Backend logs:"
                docker logs jawab24-backend-$DEPLOY_ENV --tail 30 2>&1
                exit 1
              fi
              
              sleep 5
              WAITED=$((WAITED + 5))
            done
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 STEP 6: Switching traffic to $DEPLOY_ENV"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Update upstream config
            cat > ./nginx/upstream.conf << EOF
            # Active environment: $DEPLOY_ENV
            # Switched at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            
            upstream backend_active {
                server jawab24-backend-$DEPLOY_ENV:3000;
            }
            
            upstream frontend_active {
                server jawab24-frontend-$DEPLOY_ENV:3001;
            }
            
            upstream ai_worker_active {
                server jawab24-ai-worker-$DEPLOY_ENV:3002;
            }
            EOF
            
            # Reload nginx
            docker exec jawab24-nginx nginx -s reload
            
            # Save new active environment
            echo "$DEPLOY_ENV" > .active-env
            
            echo "✅ Traffic switched to $DEPLOY_ENV"
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🧹 STEP 7: Cleanup"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Stop old environment (keep for quick rollback - uncomment to auto-stop)
            # docker-compose -f docker-compose.yml -f docker-compose.$ACTIVE_ENV.yml stop \
            #   backend-$ACTIVE_ENV frontend-$ACTIVE_ENV ai-worker-$ACTIVE_ENV
            
            # Cleanup old images
            docker image prune -f --filter "until=24h" 2>/dev/null || true
            
            echo "✅ Cleanup complete"
            echo ""
            echo "📊 Container Status:"
            docker-compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}" | head -20

      - name: 🏥 Verify Deployment
        if: ${{ github.event.inputs.skip_health_check != 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🏥 VERIFYING DEPLOYMENT"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            FAILED=0
            
            # Verify via public endpoint
            echo ""
            echo "🔍 Testing public endpoints..."
            
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost/api/health > /dev/null 2>&1; then
                echo "   ✅ API responding"
                break
              elif [ $i -eq 5 ]; then
                echo "   ❌ API not responding"
                FAILED=1
              else
                sleep 2
              fi
            done
            
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost/ > /dev/null 2>&1; then
                echo "   ✅ Frontend responding"
                break
              elif [ $i -eq 5 ]; then
                echo "   ❌ Frontend not responding"
                FAILED=1
              else
                sleep 2
              fi
            done
            
            echo ""
            if [ $FAILED -eq 0 ]; then
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "✅ DEPLOYMENT VERIFIED"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Active: $(cat .active-env)"
              git rev-parse HEAD > .last_successful_deploy
            else
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "❌ VERIFICATION FAILED"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              exit 1
            fi

      - name: 🔄 Rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 ROLLING BACK"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            if [ -f .last_active_env ]; then
              ROLLBACK_ENV=$(cat .last_active_env)
              echo "Rolling back to: $ROLLBACK_ENV"
              
              # Update upstream to rollback environment
              cat > ./nginx/upstream.conf << EOF
            # Rollback to: $ROLLBACK_ENV
            # Rolled back at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            
            upstream backend_active {
                server jawab24-backend-$ROLLBACK_ENV:3000;
            }
            
            upstream frontend_active {
                server jawab24-frontend-$ROLLBACK_ENV:3001;
            }
            
            upstream ai_worker_active {
                server jawab24-ai-worker-$ROLLBACK_ENV:3002;
            }
            EOF
              
              docker exec jawab24-nginx nginx -s reload
              echo "$ROLLBACK_ENV" > .active-env
              
              echo "✅ Rolled back to $ROLLBACK_ENV"
            else
              echo "⚠️ No previous environment to rollback to"
            fi
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📊 Deployment Summary
        if: success()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 ZERO-DOWNTIME DEPLOYMENT SUCCESSFUL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌐 Website: https://jawab24.com"
          echo "📊 Dashboard: https://jawab24.com/dashboard"
          echo "🔧 API: https://jawab24.com/api/health"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  deploy-skipped:
    name: ⏭️ CI Failed - Skip Deploy
    runs-on: ubuntu-latest
    # Only skip if triggered by workflow_run and CI failed
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
      - name: Skip deployment
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏭️  DEPLOYMENT SKIPPED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ CI tests failed - deployment cancelled"
          echo "📝 Please fix failing tests before deploying"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1
