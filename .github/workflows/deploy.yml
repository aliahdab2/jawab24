name: Deploy

on:
  # Only trigger AFTER CI workflow completes successfully
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [main]
  
  # Allow manual deployment (for emergencies or hotfixes)
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: 'Skip health checks after deployment'
        required: false
        default: 'false'
        type: boolean
      force_deploy:
        description: 'Force deploy even if CI is running (use with caution)'
        required: false
        default: 'false'
        type: boolean

env:
  SERVER_HOST: 91.99.95.196
  SERVER_USER: root
  DEPLOY_PATH: /var/www/jawab24

jobs:
  deploy:
    name: "🚀 Deploying to Server"
    runs-on: ubuntu-latest
    # Deploy ONLY when:
    # 1. Manual trigger (workflow_dispatch)
    # 2. CI workflow completed successfully (workflow_run)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    
    steps:
      - name: 📋 Deployment Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 JAWAB24 BLUE-GREEN DEPLOYMENT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📅 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🔀 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo "🖥️  Server: ${{ env.SERVER_HOST }}"
          echo "🔄 Strategy: Blue-Green (Zero Downtime)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: 🔍 Validate Environment Variables
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔍 PRE-DEPLOYMENT VALIDATION"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Check 1: Environment variables
            echo ""
            echo "📋 Check 1/3: Environment Variables..."
            if [ -f scripts/check-env.sh ]; then
              if bash scripts/check-env.sh; then
                echo "   ✅ All required env vars present"
              else
                echo "   ❌ Environment validation failed!"
                exit 1
              fi
            else
              echo "   ⚠️  check-env.sh not found, skipping validation"
            fi
            
            # Check 2: Database connectivity
            echo ""
            echo "📋 Check 2/3: Database Connectivity..."
            if docker exec jawab24-backend wget -q -O- http://localhost:3000/health 2>/dev/null | grep -q "database.*up"; then
              echo "   ✅ Database reachable from current backend"
            else
              echo "   ❌ Cannot connect to database!"
              echo "   This will cause deployment to fail"
              exit 1
            fi
            
            # Check 3: Disk space (more aggressive - prevent "no space left" errors)
            echo ""
            echo "📋 Check 3/3: Disk Space..."
            DISK_USAGE=$(df -h / | awk 'NR==2 {print $5}' | sed 's/%//')
            echo "   📊 Current disk usage: $DISK_USAGE%"

            # Always clean build cache before deployment (main cause of disk issues)
            echo "   🔄 Clearing Docker build cache..."
            docker builder prune -af 2>/dev/null || true

            if [ "$DISK_USAGE" -lt 70 ]; then
              echo "   ✅ Sufficient disk space ($DISK_USAGE% used)"
            else
              echo "   ⚠️  Disk usage elevated: $DISK_USAGE%"
              echo "   🔄 Running pre-deployment cleanup..."

              # Clean dangling images
              docker image prune -f 2>/dev/null || true

              # Clean images older than 48 hours
              docker image prune -af --filter "until=48h" 2>/dev/null || true

              # Clean unused volumes
              docker volume prune -f 2>/dev/null || true

              NEW_USAGE=$(df -h / | awk 'NR==2 {print $5}' | sed 's/%//')
              echo "   📊 Disk usage after cleanup: $NEW_USAGE%"

              if [ "$NEW_USAGE" -gt 85 ]; then
                echo "   ⚠️  Disk still high, running aggressive cleanup..."
                docker system prune -af 2>/dev/null || true
                NEW_USAGE=$(df -h / | awk 'NR==2 {print $5}' | sed 's/%//')
                echo "   📊 Disk usage after aggressive cleanup: $NEW_USAGE%"
              fi

              if [ "$NEW_USAGE" -gt 90 ]; then
                echo "   ❌ ERROR: Disk usage critical! Deployment may fail."
                echo "   Consider manually cleaning logs and apt cache on server."
              fi
            fi
            
            echo ""
            echo "✅ Pre-deployment validation passed"
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 🔍 Validate Migrations
        run: |
          # Install only what's needed for validation (fast)
          npm ci --workspace=jawab24-backend --ignore-scripts
          cd backend
          npx ts-node scripts/validate-migrations.ts
          echo "✅ All migrations validated"

      - name: 🔐 Pre-deployment Backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            echo "📸 Creating backup point..."
            BACKUP_COMMIT=$(git rev-parse HEAD)
            echo "$BACKUP_COMMIT" > .last_successful_deploy
            
            # Save current active environment
            if [ -f .active-env ]; then
              cp .active-env .last_active_env
            fi
            
            echo "✅ Backup: $BACKUP_COMMIT"

      - name: 🐳 Blue-Green Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            
            # Ensure deployment script is updated and executable
            echo "🔄 Updating deployment scripts..."
            git fetch origin main > /dev/null
            git checkout origin/main -- scripts/deploy-on-server.sh
            chmod +x scripts/deploy-on-server.sh
            
            # Run the unified deployment script
            ./scripts/deploy-on-server.sh

      - name: 🏥 Verify Deployment
        if: ${{ github.event.inputs.skip_health_check != 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🏥 COMPREHENSIVE DEPLOYMENT VERIFICATION"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            FAILED=0
            
            # Test 1: Backend Health (using HTTPS since nginx redirects HTTP->HTTPS)
            echo ""
            echo "🔍 Test 1/6: Backend Health Check..."
            for i in {1..10}; do
              if curl -sfL https://jawab24.com/api/health > /dev/null 2>&1; then
                echo "   ✅ Backend API responding (attempt $i)"
                break
              elif [ $i -eq 10 ]; then
                echo "   ❌ Backend not responding after 10 attempts"
                FAILED=1
              else
                echo "   ⏳ Retrying... ($i/10)"
                sleep 2
              fi
            done
            
            # Test 2: Frontend Health (accept 301 redirect as success - means nginx is working)
            echo ""
            echo "🔍 Test 2/6: Frontend Availability..."
            for i in {1..10}; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
                echo "   ✅ Frontend responding (HTTP $HTTP_CODE - redirect to HTTPS is expected)"
                break
              elif [ $i -eq 10 ]; then
                echo "   ❌ Frontend not available (HTTP $HTTP_CODE)"
                FAILED=1
              else
                echo "   ⏳ Retrying... ($i/10)"
                sleep 2
              fi
            done
            
            # Test 3: Database Connectivity (using HTTPS)
            echo ""
            echo "🔍 Test 3/6: Database Connectivity..."
            HEALTH_JSON=$(curl -sfL https://jawab24.com/api/health)
            if echo "$HEALTH_JSON" | grep -q '"database":"up"'; then
              echo "   ✅ Database connected"
            else
              echo "   ❌ Database connection failed"
              echo "   Response: $HEALTH_JSON"
              FAILED=1
            fi
            
            # Test 4: Critical API Endpoints (using HTTPS)
            echo ""
            echo "🔍 Test 4/6: Critical API Endpoints..."
            
            # Test /api/plans (public endpoint)
            if curl -sfL https://jawab24.com/api/plans > /dev/null 2>&1; then
              echo "   ✅ GET /api/plans - OK"
            else
              echo "   ❌ GET /api/plans - FAILED"
              FAILED=1
            fi
            
            # Test 5: HTTPS/SSL
            echo ""
            echo "🔍 Test 5/6: HTTPS/SSL Certificate..."
            if curl -sf https://jawab24.com/api/health > /dev/null 2>&1; then
              echo "   ✅ HTTPS working"
            else
              echo "   ❌ HTTPS not working"
              FAILED=1
            fi
            
            # Test 6: Container Health Status
            echo ""
            echo "🔍 Test 6/6: Container Health Status..."
            ACTIVE_ENV=$(cat .active-env)
            
            UNHEALTHY=$(docker ps --format "{{.Names}}\t{{.Status}}" | grep "$ACTIVE_ENV" | grep -v "healthy" | wc -l)
            if [ "$UNHEALTHY" -eq 0 ]; then
              echo "   ✅ All active containers healthy"
            else
              echo "   ❌ Some containers unhealthy:"
              docker ps --format "table {{.Names}}\t{{.Status}}" | grep "$ACTIVE_ENV"
              FAILED=1
            fi
            
            echo ""
            if [ $FAILED -eq 0 ]; then
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "✅ DEPLOYMENT VERIFIED"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Active: $(cat .active-env)"
              git rev-parse HEAD > .last_successful_deploy
            else
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "❌ VERIFICATION FAILED"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              exit 1
            fi

      - name: 🔄 Rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 ROLLING BACK"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            if [ -f .last_active_env ]; then
              ROLLBACK_ENV=$(cat .last_active_env)
              echo "Rolling back to: $ROLLBACK_ENV"
              
              # Update upstream to rollback environment
              cat > ./nginx/upstream.conf << EOF
            # Rollback to: $ROLLBACK_ENV
            # Rolled back at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            
            upstream backend_active {
                server jawab24-backend-$ROLLBACK_ENV:3000;
            }
            
            upstream frontend_active {
                server jawab24-frontend-$ROLLBACK_ENV:3001;
            }
            
            upstream ai_worker_active {
                server jawab24-ai-worker-$ROLLBACK_ENV:3002;
            }
            EOF
              
              # Restart Nginx to apply rollback config (reload doesn't work with read-only mounts)
              echo "🔄 Restarting Nginx to apply rollback configuration..."
              docker restart jawab24-nginx
              
              # Wait for Nginx to be healthy
              for i in {1..30}; do
                if docker inspect jawab24-nginx | grep -q '"Status": "healthy"'; then
                  echo "✅ Nginx is healthy"
                  break
                fi
                sleep 1
              done
              
              echo "$ROLLBACK_ENV" > .active-env
              
              # Verify rollback worked
              ACTUAL_ENV=$(curl -s http://localhost/api/version | grep -o '"environment":"[^"]*"' | cut -d'"' -f4)
              if [ "$ACTUAL_ENV" = "$ROLLBACK_ENV" ]; then
                echo "✅ Rolled back to $ROLLBACK_ENV (verified)"
              else
                echo "⚠️  WARNING: Rollback may not have taken effect (expected $ROLLBACK_ENV, got $ACTUAL_ENV)"
              fi
            else
              echo "⚠️ No previous environment to rollback to"
            fi
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📊 Deployment Summary
        if: success()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 ZERO-DOWNTIME DEPLOYMENT SUCCESSFUL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌐 Website: https://jawab24.com"
          echo "📊 Dashboard: https://jawab24.com/dashboard"
          echo "🔧 API: https://jawab24.com/api/health"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Deployed by: ${{ github.actor }}"
          echo "⏰ Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: ❌ Deployment Failed - Send Alert
        if: failure()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ DEPLOYMENT FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔄 Automatic rollback triggered"
          echo "📝 Check logs for details"
          echo "🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  deploy-skipped:
    name: "⏸️ Deploy Skipped (CI Failed)"
    runs-on: ubuntu-latest
    # Only runs if CI failed - otherwise this job is skipped entirely
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
      - name: Skip deployment
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏭️  DEPLOYMENT SKIPPED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ CI tests failed - deployment cancelled"
          echo "📝 Please fix failing tests before deploying"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1
