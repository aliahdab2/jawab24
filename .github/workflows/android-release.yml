name: Android Release

# Thin CI wrapper around scripts/release-android.sh — materializes the repo
# Actions secrets into the files/env the script expects, then calls the SAME
# script you run locally (mirrors deploy-production.sh: one entrypoint, two callers).

on:
  # Dispatch-only. The local scripts/release-android.sh is the authoritative release
  # path; this workflow is a CI fallback for when GitHub Actions is available. There is
  # no tag trigger, so an android-v* release marker never double-uploads.
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName, e.g. 1.2.3'
        required: true
        type: string
      track:
        description: 'Play track to upload to'
        required: true
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: read            # stateless versioning — no commit-back, no write needed

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish signed AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version & track
        id: in
        run: |
          echo "version=${{ inputs.versionName }}" >> "$GITHUB_OUTPUT"
          echo "track=${{ inputs.track }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json   # monorepo root lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'                          # AGP 8.13 requires JDK 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (workspaces root)
        run: npm ci

      - name: Materialize signing + Firebase secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/jawab24-upload.jks
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}"    | base64 --decode > frontend/android/app/google-services.json
          cat > frontend/android/local.properties <<EOF
          FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN=${{ secrets.FACEBOOK_CLIENT_TOKEN }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          RELEASE_STORE_FILE=../jawab24-upload.jks
          RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Release (calls the shared script)
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          ./scripts/release-android.sh "${{ steps.in.outputs.track }}" \
            --version "${{ steps.in.outputs.version }}" \
            --ci --skip-tests          # main CI already ran lint+tests on this commit

      - name: Upload AAB + mapping artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.in.outputs.version }}
          path: |
            frontend/android/app/build/outputs/bundle/release/*.aab
            frontend/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Scrub provisioned secrets
        if: always()
        run: |
          rm -f frontend/android/jawab24-upload.jks \
                frontend/android/local.properties \
                frontend/android/app/google-services.json
