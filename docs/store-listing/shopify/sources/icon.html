<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  /* Shopify icon spec: 1200x1200, NO transparency, NO pre-rounded corners
     (Shopify applies its own rounding). The brand tile therefore goes
     full-bleed: gradient edge-to-edge, chat bubble centered. */
  html, body { width: 1200px; height: 1200px; }
  svg { width: 1200px; height: 1200px; display: block; }
</style>
</head>
<body>
  <!-- Jawab24 brand mark (frontend/public/brand/icon-vector.svg) with the rounded
       square flattened to a full-bleed square per the Shopify spec. -->
  <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#06B6D4"/>
        <stop offset="100%" style="stop-color:#F97316"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGradient)"/>
    <path d="M512 240C339.2 240 198.4 355.2 198.4 496C198.4 564.8 233.6 627.2 291.2 672C291.2 672 275.2 752 224 800C224 800 332.8 784 400 736C435.2 752 473.6 760 512 760C684.8 760 825.6 644.8 825.6 504C825.6 363.2 684.8 240 512 240Z" fill="white"/>
  </svg>
</body>
</html>
