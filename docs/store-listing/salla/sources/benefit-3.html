<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./frame.css">
<style>
  .channels { display: flex; flex-direction: column; align-items: center; margin-top: auto; padding-bottom: 120px; }
  .chips { display: flex; gap: 56px; }
  .chip {
    width: 300px; background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 34px; padding: 40px 20px 34px; display: flex; flex-direction: column; align-items: center; gap: 20px;
    backdrop-filter: blur(4px);
  }
  .chip .ic { width: 108px; height: 108px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .chip .nm { font-size: 33px; font-weight: 800; color: #fff; }
  .flow { display: flex; flex-direction: column; align-items: center; margin-top: 40px; }
  .flow svg.arrows { display: block; }
  .hub {
    display: flex; align-items: center; gap: 22px; background: #fff; border-radius: 30px;
    padding: 26px 46px; box-shadow: 0 26px 70px rgba(2,30,27,0.5); margin-top: 6px;
  }
  .hub img { width: 84px; height: 84px; border-radius: 20px; }
  .hub .tx { text-align: start; }
  .hub .tx .a { font-size: 37px; font-weight: 900; color: #134e4a; line-height: 1.2; }
  .hub .tx .b { font-size: 25px; font-weight: 600; color: #557; color: #5b6d6b; }
</style>
</head>
<body>
<div class="benefit">
  <div class="kicker">
    <div class="t">جواب24</div>
    <img src="./icon-512.png" alt="">
  </div>
  <h1>واتساب وفيسبوك وإنستغرام <em>في تطبيق واحد</em></h1>
  <p class="sub">مندوب مبيعاتك الذكي يعمل طوال اليوم دون توقّف، ويرد على الرسائل والتعليقات من لوحة واحدة.</p>

  <div class="channels">
    <div class="chips">
      <div class="chip">
        <div class="ic" style="background:#25D366;">
          <svg width="62" height="62" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a9.9 9.9 0 0 0-8.5 15L2 22l5.2-1.4A9.9 9.9 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-3-.2-.3A8 8 0 1 1 12 20zm4.5-6c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.6 6.6 0 0 1-2-1.2 7.3 7.3 0 0 1-1.3-1.7c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.2-.3.3-.5a.5.5 0 0 0 0-.5c0-.1-.6-1.4-.8-1.9s-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5 5 0 0 0 1 2.7 11.4 11.4 0 0 0 4.4 3.9 14.8 14.8 0 0 0 1.5.5 3.6 3.6 0 0 0 1.6.1 2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.2-.2-.2-.4-.3z"/></svg>
        </div>
        <div class="nm">واتساب</div>
      </div>
      <div class="chip">
        <div class="ic" style="background:#1877F2;">
          <svg width="58" height="58" viewBox="0 0 24 24" fill="#fff"><path d="M13.5 21v-7h2.4l.4-3h-2.8V9.1c0-.9.2-1.5 1.5-1.5h1.4V5a19 19 0 0 0-2.1-.1 3.3 3.3 0 0 0-3.6 3.7V11H8.3v3h2.4v7z"/></svg>
        </div>
        <div class="nm">فيسبوك</div>
      </div>
      <div class="chip">
        <div class="ic" style="background:radial-gradient(circle at 30% 110%, #fdc468 0%, #df4996 45%, #8a3ab9 90%);">
          <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/><circle cx="12" cy="12" r="4.3"/><circle cx="17.4" cy="6.6" r="1.15" fill="#fff" stroke="none"/></svg>
        </div>
        <div class="nm">إنستغرام</div>
      </div>
    </div>
    <div class="flow">
      <svg class="arrows" width="760" height="92" viewBox="0 0 760 92" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round">
        <path d="M120 6 C 120 60, 340 52, 368 84"/>
        <path d="M380 8 L 380 82"/>
        <path d="M640 6 C 640 60, 420 52, 392 84"/>
      </svg>
      <div class="hub">
        <img src="./icon-512.png" alt="">
        <div class="tx">
          <div class="a">جواب24</div>
          <div class="b">كل رسائلك وتعليقاتك في مكان واحد</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
