services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jawab24-db
    restart: unless-stopped
    env_file:
      - ./env/db.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - jawab24-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jawab24"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jawab24-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - jawab24-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jawab24-backend
    restart: unless-stopped
    env_file:
      - ./env/backend.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:jawab24_secure_password@postgres:5432/jawab24
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jawab24-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # AI Worker
  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: jawab24-ai-worker
    restart: unless-stopped
    env_file:
      - ./env/ai.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jawab24-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_FB_APP_ID=774211662298446
        - NEXT_PUBLIC_API_URL=https://jawab24.com/api
    container_name: jawab24-frontend
    restart: unless-stopped
    env_file:
      - ./env/frontend.env
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - jawab24-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: jawab24-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      - ai-worker
    networks:
      - jawab24-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  jawab24-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
