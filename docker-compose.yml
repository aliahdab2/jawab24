# Jawab24 Docker Compose Configuration

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: jawab24-postgres
    restart: unless-stopped
    env_file:
      - ./env/db.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - jawab24-network
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"
        reservations:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d jawab24" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jawab24-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 800mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:-changeme_in_production}
    volumes:
      - redis-data:/data
    networks:
      - jawab24-network
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
        reservations:
          memory: 256m
          cpus: "0.1"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "--no-auth-warning", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API
  backend:
    image: jawab24-backend:latest
    container_name: jawab24-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/backend.env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_in_production}
      - AI_SERVICE_URL=http://ai-worker:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jawab24-network
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # AI Worker
  ai-worker:
    image: jawab24-ai-worker:latest
    container_name: jawab24-ai-worker
    build:
      context: .
      dockerfile: ai-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/ai.env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_in_production}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jawab24-network
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend (Next.js)
  frontend:
    image: jawab24-frontend:latest
    container_name: jawab24-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Every NEXT_PUBLIC_* ARG the Dockerfile declares MUST be listed here.
      # Next.js inlines these at BUILD time, so an omitted arg is compiled to
      # `undefined` and the feature dies silently in the image — it cannot be
      # repaired by env_file at runtime. `frontend`, `frontend-blue` and
      # `frontend-green` all tag jawab24-frontend:latest, so the lists must be
      # identical; pinned by frontend/test/deployBuildArgs.test.ts.
      args:
        - NEXT_PUBLIC_FB_APP_ID=${NEXT_PUBLIC_FB_APP_ID:-}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://jawab24.com/api}
        - NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        - NEXT_PUBLIC_WHATSAPP_CONFIG_ID=${NEXT_PUBLIC_WHATSAPP_CONFIG_ID:-}
        - NEXT_PUBLIC_WHATSAPP_CANARY_ADMIN_ONLY=${NEXT_PUBLIC_WHATSAPP_CANARY_ADMIN_ONLY:-}
        - NEXT_PUBLIC_WHATSAPP_CONNECT_REDIRECT=${NEXT_PUBLIC_WHATSAPP_CONNECT_REDIRECT:-}
        - NEXT_PUBLIC_INSTAGRAM_DIRECT_ENABLED=${NEXT_PUBLIC_INSTAGRAM_DIRECT_ENABLED:-}
        - NEXT_PUBLIC_PHONE_AUTH_ENABLED=${NEXT_PUBLIC_PHONE_AUTH_ENABLED:-}
        - NEXT_PUBLIC_CHECKOUT_MAINTENANCE=${NEXT_PUBLIC_CHECKOUT_MAINTENANCE:-}
        - SEMANTIC_VERSION=${SEMANTIC_VERSION:-untagged}
    restart: unless-stopped
    env_file:
      - ./env/frontend.env
    environment:
      - NODE_ENV=production
    networks:
      - jawab24-network
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: jawab24-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/upstream.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - jawab24-network
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m
          cpus: "0.05"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  jawab24-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
